<div
  class="flex items-center gap-3 p-3 rounded-xl border border-white/20 bg-white/30 dark:bg-gray-800/30 shadow-2xl backdrop-blur-md transform hover:-translate-y-1 transition-all duration-300">
  <div class="w-16 h-16 rounded-md relative flex items-center justify-center">
    <img alt="Album cover"
         width="60"
         height="60"
         class="opacity-90 rounded-md shadow-lg"
         [ngSrc]="isPlaying ? albumImageUrl : spotifyImageUrl">

    @if (isPlaying) {
      <img [ngSrc]="spotifyImageUrl"
           width="12"
           height="12"
           alt="Spotify"
           class="absolute top-0 left-0 w-5 h-5 shadow-lg rounded-full border border-white/30 bg-white/80 dark:bg-gray-800/80 transform -translate-x-1/4 -translate-y-1/4">
    }

  </div>

  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-2">
      <span class="text-xs text-muted-foreground font-medium">
        {{ isPlaying ? artist : 'Offline' }}
      </span>
    </div>
    <div class="flex flex-col">
      <span class="font-medium text-muted-foreground">
        {{ isPlaying ? songTitle : 'Not currently listening' }}
      </span>
      <span class="text-xs text-muted-foreground">
        {{ isPlaying ? 'Currently listening' : 'Music activity unavailable' }}
      </span>
    </div>
  </div>
</div>
